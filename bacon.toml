default_job = "check"

[jobs.check]
command = ["cargo", "check", "--workspace", "--all-targets"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
need_stdout = false

[jobs.nextest]
command = ["cargo", "nextest", "run", "--workspace"]
need_stdout = true

# Per-crate: bacon nextest-crate -- ta-protocol
[jobs.nextest-crate]
command = ["bash", "-lc", "cargo nextest run --workspace -E 'package($1)'"]
need_stdout = true
allow_fail = true

[jobs.fmt]
command = ["cargo", "fmt", "--check"]
need_stdout = false
