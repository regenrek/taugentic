[extend]
useDefault = true

[[allowlists]]
description = "Rust auth_token parameter name in remote websocket config"
paths = ['''crates/ta-orchestrator/src/host/config.rs''']
regexTarget = "line"
regexes = ['''^\s*auth_token: Option<String>,\s*$''']

# Synthetic daemon integration auth_token fixture. Scoped to the remote
# websocket integration test files where the fixed test token appears.
[[allowlists]]
description = "Synthetic remote websocket auth_token test fixture"
paths = ['''^crates/ta-orchestrator/tests/daemon_integration(/(lifecycle|restart_and_remote)\.rs|\.rs)$''']
regexTarget = "line"
regexes = ['''^\s*let auth_token = "[0-9a-f]{32}";\s*$''']

# Synthetic ACP adapter error-redaction payload. Scoped to the commit and test
# fixture path that intentionally contains fake credential-like JSON fields.
[[allowlists]]
description = "Synthetic ACP error-redaction credential JSON fixture"
paths = ['''^crates/ta-provider-acp/src/adapter/errors\.rs$''']
regexTarget = "line"
regexes = [
  '''^\s*"api_key": "[^"]+",\s*$''',
  '''^\s*"key": "[^"]+",\s*$''',
]
